version: '3'

services:
  db:
    image: postgres:18.4-alpine3.24
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    container_name: teslodb
    volumes:
      - ./postgres:/var/lib/postgresql
